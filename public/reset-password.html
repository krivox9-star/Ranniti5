<!doctype html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Password reset | RANNITI 5</title>
  <style>:root{--red:#d71920;--ink:#171515;--muted:#77736f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f6f3;color:var(--ink);font:15px Arial,sans-serif}.card{width:min(430px,calc(100% - 32px));padding:34px;background:#fff;border:1px solid #e5e2de;border-radius:8px;box-shadow:0 20px 50px #0001}.logo{display:block;width:100%;height:auto;margin:0 0 16px}h1{color:var(--red);margin:0 0 8px}p{color:var(--muted);line-height:1.5}label{display:block;margin-top:18px;font-weight:bold}input{width:100%;margin-top:7px;min-height:45px;padding:0 12px;border:1px solid #ddd;border-radius:5px;font:inherit}button{width:100%;min-height:47px;margin-top:22px;border:0;border-radius:5px;background:var(--red);color:#fff;font-weight:bold;cursor:pointer}#message{min-height:20px;margin-top:14px;color:var(--red)}a{color:var(--red);font-weight:bold;text-decoration:none}</style>
</head>
<body><main class="card"><a href="/"><img class="logo" src="/assets/ranniti-5-logo.png" alt="RANNITI 5" /></a><h1>Reset password</h1><p id="intro">Enter your account email and we will send a secure reset link.</p><form id="requestForm"><label>Email<input id="email" type="email" required /></label><button>Send reset link</button></form><form id="resetForm" hidden><label>New password<input id="password" type="password" minlength="8" required /></label><label>Confirm password<input id="confirm" type="password" minlength="8" required /></label><button>Set new password</button></form><div id="message"></div><p><a href="/login">Back to sign in</a></p></main>
<script>
  const query = new URLSearchParams(location.search); const token = query.get('token'); const requestForm = document.getElementById('requestForm'); const resetForm = document.getElementById('resetForm'); const message = document.getElementById('message'); if (token) { requestForm.hidden = true; resetForm.hidden = false; document.getElementById('intro').textContent = 'Choose a new password with at least 8 characters.'; }
  requestForm.onsubmit = async (event) => { event.preventDefault(); const response = await fetch('/api/auth/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email:document.getElementById('email').value }) }); const body = await response.json(); message.textContent = body.message || 'Request complete.'; };
  resetForm.onsubmit = async (event) => { event.preventDefault(); if (document.getElementById('password').value !== document.getElementById('confirm').value) { message.textContent = 'Passwords do not match.'; return; } const response = await fetch('/api/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ token, password:document.getElementById('password').value }) }); const body = await response.json(); message.textContent = body.message; if (response.ok) setTimeout(() => { location.href = '/login'; }, 900); };
</script></body></html>
