<!doctype html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Member dashboard | RANNITI 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" /><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet" />
  <style>:root{--red:#d71920;--ink:#171515;--paper:#f7f6f3;--muted:#77736f;--line:#e5e2de;--green:#168653;--amber:#a96b00}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:14px Barlow,sans-serif}.top{min-height:88px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(20px,calc((100% - 1100px)/2))}.brand{display:block;flex:0 0 auto}.enquire{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;color:var(--ink);text-decoration:none}.enquire span{color:var(--red);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.enquire strong{font-size:14px;white-space:nowrap}.top-actions{display:flex;align-items:center;gap:16px}.top button,.button{border:1px solid var(--line);border-radius:5px;background:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.wrap{width:min(1100px,calc(100% - 32px));margin:auto;padding:34px 0 70px}h1,h2,h3{font-family:Barlow Condensed,sans-serif}h1{font-size:40px;margin:0 0 5px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:20px;box-shadow:0 12px 30px #1715150b}.stat strong{display:block;font:700 29px Barlow Condensed;margin-top:8px}.cards{display:grid;gap:16px}.card h2{margin:0 0 16px;font-size:25px}.record{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;padding:18px 0;border-top:1px solid var(--line)}.record:first-child{border-top:0}.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}.value{margin-top:6px;font-weight:600}.badge{display:inline-block;margin-top:6px;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700}.confirmed{color:var(--green);background:#e6f5ed}.pending{color:var(--amber);background:#fff4dc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.button.red{color:#fff;background:var(--red);border-color:var(--red)}.empty{padding:24px 0;color:var(--muted)}#message{color:var(--red);margin-top:20px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.record{grid-template-columns:1fr}.top{min-height:72px;padding:0 16px}.wrap{padding-top:25px}}
  </style>
</head>
<body><header class="top"><div class="top-actions"><a class="enquire" href="tel:+919998813569"><span>Enquire</span><strong>+91 9998813569</strong></a><div><span id="memberName" class="muted"></span> <button id="logout">Log out</button></div></div></header><main class="wrap"><h1>Member dashboard</h1><p class="muted">Your live registration, payment and event documents.</p><div class="grid"><div class="stat"><span class="muted">Registrations</span><strong id="count">0</strong></div><div class="stat"><span class="muted">Confirmed</span><strong id="confirmed">0</strong></div><div class="stat"><span class="muted">Entry passes</span><strong id="passes">0</strong></div></div><section class="card"><h2>Your registrations</h2><div id="records"></div><div id="message"></div></section></main>
<script>
  const token = localStorage.getItem('ranniti_member_token'); const records = document.getElementById('records'); const message = document.getElementById('message'); const money = (value) => `₹${Number(value || 0).toLocaleString('en-IN', { maximumFractionDigits:2 })}`; const date = (value) => value ? new Date(value).toLocaleString('en-IN', { dateStyle:'medium', timeStyle:'short' }) : '—'; const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const download = async (type, id) => { const response = await fetch(`/api/member/documents/${type}/${encodeURIComponent(id)}`, { headers:{ Authorization:`Bearer ${token}` } }); if (!response.ok) { message.textContent = 'Document is not available yet.'; return; } const link = document.createElement('a'); link.href = URL.createObjectURL(await response.blob()); link.download = `${type}-${id}.pdf`; link.click(); URL.revokeObjectURL(link.href); };
  async function load() { if (!token) { location.href='/login'; return; } const response = await fetch('/api/member/dashboard', { headers:{ Authorization:`Bearer ${token}` } }); const body = await response.json(); if (!response.ok) { localStorage.removeItem('ranniti_member_token'); location.href='/login'; return; } document.getElementById('memberName').textContent = body.member.name; document.getElementById('count').textContent = body.registrations.length; document.getElementById('confirmed').textContent = body.registrations.filter((item) => item.status === 'Confirmed').length; document.getElementById('passes').textContent = body.registrations.filter((item) => item.entryPass).length; records.innerHTML = body.registrations.map((item) => `<article class="record"><div><div class="label">Member</div><div class="value">${esc(item.full_name)}</div><div class="muted">${esc(item.registrationId || item.id)}</div></div><div><div class="label">Package / amount</div><div class="value">${esc(item.package_name)} · ${money(item.amount)}</div><span class="badge ${item.status === 'Confirmed' ? 'confirmed' : 'pending'}">${esc(item.status || 'Pending')}</span></div><div><div class="label">Documents</div><div class="actions">${item.invoice ? `<button class="button red" data-download="invoice" data-id="${esc(item.id)}">Invoice</button>` : '<span class="muted">Invoice after confirmation</span>'}${item.entryPass ? `<button class="button red" data-download="entry-pass" data-id="${esc(item.id)}">Entry pass</button>` : ''}</div>${item.checkin ? `<div class="muted">Checked in ${date(item.checkin.checked_at)}</div>` : ''}</div></article>`).join('') || '<div class="empty">No registrations found.</div>'; }
  records.onclick = (event) => { const button = event.target.closest('[data-download]'); if (button) download(button.dataset.download, button.dataset.id); }; document.getElementById('logout').onclick = () => { localStorage.removeItem('ranniti_member_token'); location.href='/login'; }; load();
</script></body></html>
