<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ranniti 5 registration confirmation." />
    <title>Registration Confirmed — Ranniti 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#101010; --text:#f6f2ee; --muted:#d2c7c0; --accent:#f04b35; --accent-2:#f7a55c; --line:rgba(255,255,255,.1); }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; color:var(--text); font-family:"Barlow",sans-serif; display:grid; grid-template-rows:auto 1fr; background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),radial-gradient(circle at 50% 0%,rgba(240,75,53,.18),transparent 32%),linear-gradient(180deg,#0d0d0d,#110f0f); background-size:72px 72px,72px 72px,auto,auto; }
      a { color:inherit; text-decoration:none; }
      h1 { margin:0; font:clamp(3rem,8vw,6rem)/.92 "Bebas Neue",sans-serif; letter-spacing:.04em; }
      .topbar { border-bottom:1px solid var(--line); background:rgba(10,10,10,.78); backdrop-filter:blur(12px); }
      .nav { width:min(1180px,calc(100% - 40px)); min-height:88px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:20px; }
      .back { color:var(--muted); font-weight:700; }
      .nav-side { display:flex; align-items:center; gap:22px; }
      .enquire { display:flex; flex-direction:column; align-items:flex-end; line-height:1.15; color:var(--text); }
      .enquire span { color:var(--accent-2); font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
      .enquire strong { font-size:14px; white-space:nowrap; }
      main { width:min(680px,calc(100% - 40px)); margin:auto; padding:50px 0; }
      .confirmation { padding:clamp(28px,7vw,60px) clamp(22px,7vw,64px); border:1px solid rgba(247,165,92,.25); border-radius:24px; text-align:center; background:rgba(28,22,20,.92); box-shadow:0 25px 70px rgba(0,0,0,.3); }
      .check { width:68px; height:68px; margin:0 auto 24px; display:grid; place-items:center; border:1px solid rgba(34,197,94,.4); border-radius:50%; color:#b8f7cd; background:rgba(34,197,94,.12); font-size:2rem; }
      .kicker { color:var(--accent-2); font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
      .confirmation h1 { margin-top:12px; }
      .message { max-width:500px; margin:20px auto 0; color:var(--muted); font-size:1.1rem; line-height:1.7; }
      .message strong { color:var(--text); }
      .details { margin-top:28px; padding:16px; border:1px solid var(--line); border-radius:12px; color:var(--muted); line-height:1.6; background:rgba(255,255,255,.03); }
      .button { display:inline-flex; align-items:center; justify-content:center; min-height:50px; margin-top:28px; padding:0 24px; border-radius:10px; color:#fff; background:linear-gradient(135deg,var(--accent),#d93f2e); font-weight:700; }
      @media (max-width:700px) { .nav { min-height:72px; } .nav-side { gap:12px; } .enquire strong { font-size:13px; } .back { font-size:.9rem; } }
    </style>
  </head>
  <body>
    <header class="topbar"><div class="nav"><div class="nav-side"><a class="enquire" href="tel:+919998813569"><span>Enquire</span><strong>+91 9998813569</strong></a><a class="back" href="/">Back to event</a></div></div></header>
    <main>
      <section class="confirmation" aria-labelledby="confirmationTitle">
        <div class="check" aria-hidden="true">✓</div>
        <span class="kicker">Registration received</span>
        <h1 id="confirmationTitle">Registration Successful</h1>
        <p class="message" id="confirmationMessage">Your RANNITI 5 registration has been received.</p>
        <div class="details" id="confirmationDetails">Loading registration details…</div>
        <a class="button" href="/">Return to event</a>
      </section>
    </main>
  <script>
    const escapeText = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
    const registrationId = new URLSearchParams(window.location.search).get('registrationId');
    if (registrationId) {
      fetch('/api/registrations/' + encodeURIComponent(registrationId) + '/confirmation', { headers: { 'X-Registration-Token': sessionStorage.getItem('ranniti_registration_token') || '' } })
        .then(async (response) => { const body = await response.json(); if (!response.ok) throw new Error(body.message || 'Registration not found'); return body.registration; })
        .then((registration) => {
          const total = Number(registration.total_amount ?? registration.amount ?? 0).toLocaleString('en-IN', { style: 'currency', currency: 'INR' });
          document.getElementById('confirmationMessage').innerHTML = `Thank you, <strong>${escapeText(registration.full_name)}</strong>. Your registration has been received.`;
          document.getElementById('confirmationDetails').innerHTML = `<strong>Registration ID:</strong> ${escapeText(registration.id)}<br><strong>Member:</strong> ${escapeText(registration.full_name)}<br><strong>Package:</strong> ${escapeText(registration.package_name)}<br><strong>Total amount:</strong> ${escapeText(total)}<br><strong>Payment status:</strong> ${escapeText(registration.payment_status || 'Pending')}`;
        })
        .catch((error) => { document.getElementById('confirmationDetails').textContent = error.message; });
    } else {
      document.getElementById('confirmationDetails').textContent = 'Please keep your payment reference available until your registration is verified.';
    }
  </script>
  </body>
</html>
